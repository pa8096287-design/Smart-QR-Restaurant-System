<!DOCTYPE html>
<html>
<head>
<title>Print QR</title>
<style>
.box{border:2px solid black; padding:15px; margin:15px; display:inline-block; text-align:center; width:300px}
.qr-grid{display:flex; flex-wrap:wrap; justify-content:center}
@media print{.no-print{display:none}}
</style>
</head>
<body>
<h2 class="no-print">AyushRestaurant - 5 Tables QR</h2>
<button class="no-print" onclick="window.print()" style="background:black; color:white; padding:12px 30px; border-radius:10px;">PRINT KARO</button>
<div class="qr-grid" id="qrGrid"></div>
<script>
var yourLink = "https://pa8096287-design.github.io/Smart-QR-Restaurant-System/index.html";
var grid = document.getElementById('qrGrid');
for(var i=1; i<=5; i++){
 var tableUrl = yourLink + "?table=" + i;
 var qrApi = "https://api.qrserver.com/v1/create-qr-code/?size=500x500&data=" + encodeURIComponent(tableUrl);
 grid.innerHTML += '<div class="box"><img src="'+qrApi+'" width="250"><br><b>TABLE '+i+'</b><p style="font-size:10px; word-break:break-all;">'+tableUrl+'</p></div>';
}
</script>
</body>
</html>
