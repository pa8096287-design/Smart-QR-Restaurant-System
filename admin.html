<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kitchen Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background: #f0f2f5; padding: 20px; }
        .header { background: white; padding: 20px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 10px #0001; }
        .stat { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; margin: 20px 0; }
        .stat div { background: white; padding: 15px; border-radius: 10px; text-align: center; box-shadow: 0 2px 8px #0001; }
        .stat h2 { color: #ff4d4d; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }
        .order { background: white; padding: 15px; border-radius: 12px; border-left: 5px solid #22c55e; box-shadow: 0 2px 10px #0001; }
        .badge { background: #ff4d4d; color: white; padding: 3px 10px; border-radius: 20px; font-size: 12px; }
        .empty { text-align: center; padding: 80px; color: #999; }
        button { padding: 8px 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <h2>📦 Kitchen Dashboard</h2>
            <p style="font-size:12px;color:#888">Auto-refresh active hai (Har 5 sec mein naye orders aayenge)</p>
        </div>
        <div>
            <button onclick="loadOrders()" style="background:#ff4d4d;color:white">🔄 Manual Refresh</button>
        </div>
    </div>

    <div class="stat">
        <div><h2 id="c1">0</h2><p>Active Orders</p></div>
        <div><h2 id="c2">₹0</h2><p>Revenue</p></div>
        <div><h2 style="color:#22c55e;">Live</h2><p>Status</p></div>
    </div>

    <div id="orders" class="grid"></div>
    <div id="empty" class="empty"><h1>📭</h1><h3>Koi active order nahi hai</h3></div>

    <script>
        // Dynamic API domain detector
        const API_BASE = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
            ? 'http://localhost:5000'
            : 'https://smart-qr-restaurant-system.onrender.com';

        function loadOrders() {
            fetch(API_BASE + '/api/orders?t=' + Date.now())
                .then(res => res.json())
                .then(data => {
                    let box = document.getElementById('orders');
                    let emp = document.getElementById('empty');
                    
                    if (!Array.isArray(data) || data.length === 0) {
                        box.innerHTML = "";
                        emp.style.display = "block";
                        document.getElementById('c1').innerText = 0;
                        document.getElementById('c2').innerText = '₹0';
                        return;
                    } 
                    
                    emp.style.display = "none";
                    document.getElementById('c1').innerText = data.length;
                    document.getElementById('c2').innerText = '₹' + data.reduce((sum, ord) => sum + Number(ord.total_amount || 0), 0);
                    
                    box.innerHTML = data.map(o => `
                        <div class="order" id="order-${o.order_id}">
                            <div style="display:flex;justify-content:space-between">
                                <span class="badge">Table ${o.table_no}</span>
                                <small style="color:#666;">${o.created_at ? new Date(o.created_at).toLocaleTimeString() : ''}</small>
                            </div>
                            <p style="margin:10px 0"><b>Dishes:</b> ${o.items || 'N/A'}</p>
                            <div style="display:flex;justify-content:space-between;align-items:center;border-top:1px dashed #eee;padding-top:10px">
                                <b>₹${o.total_amount}</b>
                                <button onclick="markServed(${o.order_id})" style="background:black;color:white">Mark Served ✅</button>
                            </div>
                        </div>
                    `).join('');
                })
                .catch(err => console.log('Error fetching orders:', err));
        }

        function markServed(orderId) {
            fetch(API_BASE + '/api/orders/' + orderId, {
                method: 'DELETE'
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    let card = document.getElementById('order-' + orderId);
                    if (card) card.remove();
                    loadOrders();
                } else {
                    alert("Order delete karne mein kuch dikkat aayi!");
                }
            })
            .catch(err => console.log('Error deleting order:', err));
        }

        // Page khulte hi load ho aur har 5 second mein auto-refresh kare
        loadOrders();
        setInterval(loadOrders, 5000);
    </script>
</body>
</html>
