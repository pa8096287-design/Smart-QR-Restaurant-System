<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Kitchen</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#f0f2f5;padding:20px}
.header{background:white;padding:20px;border-radius:12px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 10px #0001}
.stat{display:grid;grid-template-columns:1fr 1fr 1fr;gap:15px;margin:20px 0}
.stat div{background:white;padding:15px;border-radius:10px;text-align:center;box-shadow:0 2px 8px #0001}
.stat h2{color:#ff4d4d}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:15px}
.order{background:white;padding:15px;border-radius:12px;border-left:5px solid #22c55e;box-shadow:0 2px 10px #0001}
.badge{background:#ff4d4d;color:white;padding:3px 10px;border-radius:20px;font-size:12px}
.empty{text-align:center;padding:80px;color:#999}
button{padding:8px 12px;border:none;border-radius:6px;cursor:pointer;font-weight:600}
</style>
</head><body>
<div class="header"><div><h2>📦 Live Kitchen Orders</h2><p style="font-size:12px;color:#888">Auto refresh har 2 sec</p></div><div><button onclick="load()" style="background:#ff4d4d;color:white">Refresh</button> <button onclick="localStorage.clear();load()" style="background:#111;color:white">Clear</button></div></div>
<div class="stat"><div><h2 id="c1">0</h2><p>Orders</p></div><div><h2 id="c2">₹0</h2><p>Revenue</p></div><div><h2>Live</h2><p>Status</p></div></div>
<div id="orders" class="grid"></div>
<div id="empty" class="empty"><h1>📭</h1><h3>Koi order nahi hai</h3></div>
<script>
function load(){
 let all=JSON.parse(localStorage.getItem('allOrders')||'[]');
 document.getElementById('c1').innerText=all.length;
 document.getElementById('c2').innerText='₹'+all.reduce((s,o)=>s+o.total,0);
 let box=document.getElementById('orders'),emp=document.getElementById('empty');
 if(all.length==0){box.innerHTML="";emp.style.display="block";return} emp.style.display="none";
 box.innerHTML=all.reverse().map(o=>`<div class="order"><div style="display:flex;justify-content:space-between"><span class="badge">Table ${o.table}</span><small>${o.time}</small></div><p style="margin:10px 0">${o.cart.map(c=>c.name).join(', ')}</p><div style="display:flex;justify-content:space-between;align-items:center;border-top:1px dashed #eee;padding-top:10px"><b>₹${o.total}</b><button onclick="this.parentElement.parentElement.style.opacity='0.3';this.innerText='Served ✅'" style="background:black;color:white">Mark Served</button></div></div>`).join('');
}
load(); setInterval(load,2000);
</script></body></html>
